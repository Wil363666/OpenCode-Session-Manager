[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencode-session-manager"
version = "1.0.0"
description = "A web-based GUI tool for managing OpenCode sessions and projects"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "OpenCode Session Manager Contributors" }
]
keywords = ["opencode", "session-manager", "gui", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/opencode-session-manager"
Repository = "https://github.com/yourusername/opencode-session-manager"
Issues = "https://github.com/yourusername/opencode-session-manager/issues"

[project.scripts]
opencode-session-manager = "opencode_session_manager:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "opencode_session_manager.py",
    "static/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "opencode_session_manager.py",
    "static/**/*",
    "README.md",
    "LICENSE",
]
